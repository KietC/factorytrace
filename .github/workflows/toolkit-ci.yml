name: manual-cross-platform-validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: factory_trace_toolkit
    steps:
      # Pin action commits; tags alone can move / 固定提交，避免只依赖可移动标签。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: factory_trace_toolkit/constraints-tested.txt
      - name: Install declared dependencies
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install --constraint constraints-tested.txt -e ".[full]"
      - name: Toolkit and skill tests
        run: |
          python -W error::DeprecationWarning -m unittest discover -s tests -v
          python -m unittest discover -s ../skills/trace-source-factory/tests -v
          python ../skills/trace-source-factory/scripts/preflight_case.py --self-test
          python -m unittest discover -s ../tests -v
          python ../scripts/verify_public_release.py --root ..
      - name: Verify source integrity (external engines not tested here)
        run: python scripts/verify_toolkit.py --skip-runtime-smoke --output verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: source-verification-${{ matrix.os }}-py${{ matrix.python }}
          path: factory_trace_toolkit/verification.json
