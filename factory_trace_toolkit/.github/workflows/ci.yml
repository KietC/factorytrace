name: cross-platform-toolkit

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install tested installer and toolkit
        run: |
          python -m pip install "pip==26.1.2"
          python -m pip install --constraint constraints-tested.txt -e ".[full]"
      - name: Unit tests
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v
      - name: Install external media tools on Windows
        if: matrix.python == '3.14' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_media_tools.ps1
      - name: Install external media tools on macOS and Linux
        if: matrix.python == '3.14' && runner.os != 'Windows'
        shell: bash
        run: bash scripts/install_media_tools.sh
      - name: Environment preflight
        run: >-
          python -m factorytrace doctor
          --output environment.current.json
          --profile minimum
          --model-mode none
          --strict
      - name: Toolkit integrity and full runtime smoke
        if: matrix.python == '3.14'
        run: python scripts/verify_toolkit.py --output verification.json
      - name: Toolkit integrity on supported Python
        if: matrix.python != '3.14'
        run: >-
          python scripts/verify_toolkit.py
          --output verification.json
          --skip-runtime-smoke
      - name: Installed wheel resource smoke
        if: matrix.python == '3.14'
        run: python scripts/wheel_smoke.py --output wheel-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            environment.current.json
            verification.json
            wheel-smoke.json
